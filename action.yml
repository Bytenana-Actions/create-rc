name: Create Release Candidate
description: Creates milestone, issue, rc branch and PR for a target release version
author: Bytenana-Actions

inputs:
  version:
    description: Target stable version (e.g. 1.2.0 or v1.2.0)
    required: true
  bump-command:
    description: Command to set the version — VERSION env var is set to the rc version (e.g. "bump-my-version bump --new-version $VERSION --no-commit")
    required: true
  base-branch:
    description: Branch to cut the RC from and open the PR against
    required: false
    default: main
  token:
    description: GitHub token with contents:write and pull-requests:write
    required: true

branding:
  icon: git-branch
  color: yellow

runs:
  using: composite
  steps:
    - name: Create Release Candidate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUMP_COMMAND: ${{ inputs.bump-command }}
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run.sh"
