name: Create Release Candidate
description: Creates milestone, issue, rc branch and PR for a target release version

inputs:
  version:
    description: Target stable version (e.g. 1.2.0 or v1.2.0)
    required: true
  bump-command:
    description: Command to set the version — VERSION env var is set to the rc version (e.g. "bump-my-version bump --new-version $VERSION --no-commit")
    required: true
  base-branch:
    description: Branch to cut the RC from and open the PR against
    required: false
    default: main
  token:
    description: GitHub token with contents:write and pull-requests:write
    required: true

branding:
  icon: git-branch
  color: yellow

runs:
  using: composite
  steps:
    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Compute versions and branch name
      shell: bash
      run: |
        STABLE="${{ inputs.version }}"
        STABLE="${STABLE#v}"
        echo "STABLE=${STABLE}" >> "$GITHUB_ENV"
        echo "RC_VERSION=${STABLE}-rc.1" >> "$GITHUB_ENV"
        echo "BRANCH=rc-${STABLE}" >> "$GITHUB_ENV"
        echo "RC_TITLE=Release Candidate v${STABLE}" >> "$GITHUB_ENV"

    - name: Create milestone
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        MILESTONE_NUMBER=$(gh api repos/{owner}/{repo}/milestones \
          --method POST \
          --field title="${RC_TITLE}" \
          --jq '.number')
        echo "MILESTONE_NUMBER=${MILESTONE_NUMBER}" >> "$GITHUB_ENV"

    - name: Create issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        ISSUE_NUMBER=$(gh issue create \
          --title "${RC_TITLE}" \
          --body "Tracking issue for ${RC_TITLE}." \
          --milestone "${MILESTONE_NUMBER}" \
          --json number \
          --jq '.number')
        echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"

    - name: Create branch linked to issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh issue develop "${ISSUE_NUMBER}" \
          --base "${{ inputs.base-branch }}" \
          --name "${BRANCH}" \
          --checkout

    - name: Bump version
      shell: bash
      env:
        VERSION: ${{ env.RC_VERSION }}
      run: ${{ inputs.bump-command }}

    - name: Commit and push
      shell: bash
      run: |
        git add -u
        git commit -m "chore: bump version to ${RC_VERSION}"
        git push origin "${BRANCH}"

    - name: Open PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh pr create \
          --title "${RC_TITLE}" \
          --body "Closes #${ISSUE_NUMBER}" \
          --base "${{ inputs.base-branch }}" \
          --head "${BRANCH}"
