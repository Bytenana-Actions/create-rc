name: Create Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version (e.g. 1.2.0)"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: Bytenana-Actions/create-rc@rc-0.1.0
        with:
          version: ${{ inputs.version }}
          bump-command: echo "${VERSION}" > .version
          base-branch: master
          token: ${{ secrets.GITHUB_TOKEN }}
